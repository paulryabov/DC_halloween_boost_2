<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Halloween Pull-to-Refresh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #101018;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, sans-serif;
    overscroll-behavior: none;
  }

  .phone {
    position: relative;
    width: 375px;
    height: 812px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 12px #2a2a30, 0 0 0 14px #0c0c10, 0 30px 80px rgba(0,0,0,.7);
    background: #1c1c1e;
  }

  .app-loader {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: #eceef0;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 220ms ease, visibility 220ms ease;
  }

  .phone:not(.is-loading) .app-loader {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .app-loader__spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(38, 38, 38, .12);
    border-top-color: #009e36;
    border-radius: 50%;
    animation: loader-spin 760ms linear infinite;
  }

  @keyframes loader-spin {
    to { transform: rotate(360deg); }
  }

  .halloween-bg {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 300px;
    z-index: 0;
  }

  .halloween-art {
    position: absolute;
    top: 96px; left: 0;
    width: 375px; height: 200px;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
  }

  .halloween-art svg {
    display: block;
    width: 375px !important;
    height: 200px !important;
  }

  .background-motion {
    position: absolute;
    bottom: calc(100% - 91px);
    left: 0;
    width: 375px;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }

  .graveyard-background {
    display: block;
    width: 100%;
    height: auto;
  }

  .graveyard-motion {
    position: absolute;
    bottom: calc(100% - 96px);
    left: 0;
    width: 375px;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }

  .graveyard-foreground {
    display: block;
    width: 375px;
    height: 200px;
  }

  .scroller {
    position: absolute;
    top: 96px; left: 0; right: 0; bottom: 0;
    z-index: 4;
    overflow-y: auto;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    will-change: transform;
  }
  .scroller::-webkit-scrollbar { display: none; }
  .page {
    width: 375px;
    height: 1991px; /* full image minus status bar and the fixed app header */
    background: url("assets/screen.png") no-repeat 0 -96px / 375px 2087px;
    user-select: none;
    -webkit-user-drag: none;
  }

  .app-header {
    position: absolute;
    top: 44px; left: 0;
    width: 375px; height: 52px;
    z-index: 7;
    pointer-events: none;
    background: #262626 url("assets/screen.png") no-repeat 0 -44px / 375px 2087px;
  }

  .statusbar {
    position: absolute;
    top: 0; left: 0;
    width: 375px; height: 44px;
    z-index: 8;
    background: url("assets/screen.png") no-repeat top center / 375px 2087px;
    background-position: 0 0;
    pointer-events: none;
  }

  .hint {
    position: fixed;
    bottom: 16px; left: 0; right: 0;
    text-align: center;
    color: #6a6a78;
    font-size: 13px;
  }

  @media (max-width: 600px) {
    html {
      display: block;
      height: auto;
      min-height: 100%;
    }

    body {
      height: auto;
      min-height: 100dvh;
      align-items: flex-start;
      padding-top: 14px;
      overflow-x: hidden;
    }

    .phone {
      flex: 0 0 auto;
    }

    .hint {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="phone is-loading">
  <div class="app-loader" role="status" aria-live="polite" aria-label="Загрузка">
    <span class="app-loader__spinner" aria-hidden="true"></span>
  </div>
  <div class="halloween-bg"></div>
  <div class="background-motion"></div>
  <div class="halloween-art" id="halloween-art" aria-hidden="true"></div>
  <div class="scroller" id="scroller">
    <div class="page"></div>
  </div>
  <div class="graveyard-motion">
    <img class="graveyard-foreground" src="image/top background (1).svg" alt="">
  </div>
  <div class="app-header"></div>
  <div class="statusbar"></div>
</div>
<div class="hint">Потяните экран вниз (мышью или свайпом), чтобы вызвать лоадер страницы</div>

<script src="lib/lottie.min.js"></script>
<script>

/* ============================================================
   HEADER ILLUSTRATION: Lottie, with the foreground SVG on top.
   Hidden until the pull reveals it; playback starts on refresh.
   ============================================================ */
const artEl = document.getElementById('halloween-art');
const anim = lottie.loadAnimation({
  container: artEl,
  renderer: 'svg',
  loop: false,
  autoplay: false,
  path: 'image/new%20halloween_%20done.json',
});

let animReady = false;
let animDuration = 0;
anim.addEventListener('DOMLoaded', () => {
  animDuration = anim.getDuration(false);
  anim.goToAndStop(0, true);
  animReady = true;
  maybeFinishLoading();
});

function playArt() {
  if (!animReady) return;
  anim.goToAndPlay(0, true);
}

function resetArt() {
  if (!animReady) return;
  anim.stop();
  anim.goToAndStop(0, true);
}

/* ============================================================
   PULL-TO-REFRESH STATE MACHINE
   ============================================================ */
const scroller = document.getElementById('scroller');
const foregroundEl = document.querySelector('.graveyard-motion');
const backgroundEl = document.querySelector('.background-motion');
const MAX_PULL = 210;
const TRIGGER = 90;
const OPEN_PULL = 200;
const RETURN_TIME = 0.55;
const clamp01 = t => Math.min(1, Math.max(0, t));

let state = 'idle';         // idle | pulling | refreshing | returning
let pull = 0;               // current translateY of content
let startY = 0;
let refreshStart = 0;
let returnStart = 0;
let returnFromPull = 0;

function setPull(px) {
  pull = px;
  const transform = px > 0 ? `translateY(${px}px)` : '';
  scroller.style.transform = transform;
  foregroundEl.style.transform = transform;
  backgroundEl.style.transform = transform;
  const shown = Math.min(1, px / 64).toFixed(3);
  foregroundEl.style.opacity = px > 0 ? '1' : '0';
  backgroundEl.style.opacity = shown;
  artEl.style.opacity = state === 'refreshing' ? '1' : shown;
}

scroller.addEventListener('pointerdown', e => {
  if (state !== 'idle') return;
  startY = e.clientY;
  scroller.setPointerCapture(e.pointerId);
});
scroller.addEventListener('pointermove', e => {
  if (state === 'refreshing' || state === 'returning') return;
  const dy = e.clientY - startY;
  if (scroller.scrollTop <= 0 && dy > 0 && e.buttons) {
    state = 'pulling';
    e.preventDefault();
    // rubber-band resistance
    setPull(Math.min(MAX_PULL, MAX_PULL * (1 - Math.exp(-dy / 160))));
  } else if (state === 'pulling') {
    state = 'idle';
    setPull(0);
  }
});
function endPull() {
  if (state !== 'pulling') return;
  if (pull >= TRIGGER) {
    state = 'refreshing';
    refreshStart = clock.getElapsedTime();
    playArt();
    scroller.style.transition = 'transform .25s ease-out';
    foregroundEl.style.transition = 'transform .25s ease-out, opacity .25s ease-out';
    backgroundEl.style.transition = 'transform .25s ease-out, opacity .25s ease-out';
    setPull(OPEN_PULL);
    setTimeout(() => {
      scroller.style.transition = '';
      foregroundEl.style.transition = '';
      backgroundEl.style.transition = '';
    }, 260);
  } else {
    startReturn();
  }
}
scroller.addEventListener('pointerup', endPull);
scroller.addEventListener('pointercancel', endPull);
// block native touch scroll while pulling
scroller.addEventListener('touchmove', e => {
  if (state === 'pulling' || state === 'refreshing') e.preventDefault();
}, { passive: false });

function startReturn() {
  state = 'returning';
  returnStart = clock.getElapsedTime();
  returnFromPull = pull;
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = {
  t0: performance.now(),
  getElapsedTime() { return (performance.now() - this.t0) / 1000; },
};

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();

  if (state === 'refreshing' && animDuration > 0 && t - refreshStart >= animDuration) {
    startReturn();
  }
  if (state === 'returning') {
    const k = clamp01((t - returnStart) / RETURN_TIME);
    const ease = 1 - Math.pow(1 - k, 3);
    setPull(returnFromPull * (1 - ease));
    if (k >= 1) {
      state = 'idle';
      setPull(0);
      resetArt();
    }
  }

}
tick();

const phoneEl = document.querySelector('.phone');
let pageLoaded = document.readyState === 'complete';
function maybeFinishLoading() {
  if (pageLoaded && animReady) {
    requestAnimationFrame(() => phoneEl.classList.remove('is-loading'));
  }
}
if (pageLoaded) maybeFinishLoading();
else window.addEventListener('load', () => { pageLoaded = true; maybeFinishLoading(); }, { once: true });
</script>
</body>
</html>
